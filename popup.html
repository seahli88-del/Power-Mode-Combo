<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power Mode Combo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      background: #f3f6f4;
      color: #182521;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { width: 316px; margin: 0; padding: 18px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; }
    h1 { margin: 0; font-size: 16px; font-weight: 700; }
    .eyebrow { display: block; margin-bottom: 4px; color: #587066; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .track { position: absolute; inset: 0; border-radius: 14px; background: #a8b5ae; cursor: pointer; transition: background .16s ease; }
    .track::after { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: white; content: ""; transition: transform .16s ease; }
    .switch input:checked + .track { background: #14805e; }
    .switch input:checked + .track::after { transform: translateX(18px); }
    .switch input:focus-visible + .track { outline: 3px solid #8ad7b9; outline-offset: 2px; }
    .field-label { display: block; margin: 0 0 7px; color: #42574e; font-size: 12px; font-weight: 650; }
    select { width: 100%; padding: 9px 10px; border: 1px solid #c9d4cd; border-radius: 6px; background: #fff; color: inherit; font: inherit; font-size: 13px; }
    select:focus-visible { outline: 3px solid #8ad7b9; outline-offset: 1px; }
    .preview { display: flex; align-items: center; gap: 11px; min-height: 68px; margin-top: 13px; padding: 10px; border: 1px solid #d8e1dc; border-radius: 6px; background: linear-gradient(115deg, #fff 15%, #e5f5eb 100%); }
    .pet-mark { display: grid; width: 44px; height: 44px; flex: 0 0 auto; place-items: center; border: 1px solid #badbc9; border-radius: 5px; background: #d8f0e1; font-size: 25px; animation: bob 1.8s ease-in-out infinite; }
    .preview-copy { min-width: 0; }
    .preview-title { display: block; font-size: 12px; font-weight: 700; }
    .preview-subtitle { display: block; margin-top: 3px; color: #61746b; font-size: 11px; line-height: 1.35; }
    .status { min-height: 15px; margin: 10px 0 0; color: #66756e; font-size: 10px; }
    .status[data-error="true"] { color: #a12f27; }
    @keyframes bob { 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .pet-mark { animation: none; } }
  </style>
</head>
<body>
  <header>
    <div><span class="eyebrow">Local typing effects</span><h1>Power Mode Combo</h1></div>
    <label class="switch" aria-label="Enable Power Mode">
      <input id="power-enabled" type="checkbox" role="switch">
      <span class="track" aria-hidden="true"></span>
    </label>
  </header>
  <main>
    <label class="field-label" for="pet-mode">Ambient companions</label>
    <select id="pet-mode">
      <option value="all">All pets</option>
      <option value="corgis-kitties">Corgis &amp; Kitties</option>
      <option value="corgis">Corgis</option>
      <option value="kitties">Kitties</option>
      <option value="octopus">Octopus</option>
      <option value="off">Off</option>
    </select>
    <section class="preview" aria-live="polite">
      <span class="pet-mark" id="preview-mark" aria-hidden="true">🐕</span>
      <span class="preview-copy"><span class="preview-title" id="preview-title">All pets</span><span class="preview-subtitle" id="preview-subtitle">Corgis, kitties, and a little deep-sea company.</span></span>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
